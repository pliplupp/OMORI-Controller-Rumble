name: C/C++ CI

on:
  push:
    branches: [ "sdl" ]
  pull_request:
    branches: [ "sdl" ]

jobs:
  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get install sdl3
    - name: make
      run: make
      
  build-win:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - run: choco install sdl3
    - name: make
      run: make

  build-mac:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - run: brew install sdl3
    - name: make
      run: make

